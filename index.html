<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1c1c1c" />
    <script>
      try {
        if (localStorage.getItem('wavelab-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name=theme-color]').content = '#f3f6f8';
        }
      } catch {}
    </script>
    <title>训练的大鲨鱼 · 实时交易与历史训练</title>
    <meta name="description" content="查看比特币、股指期货与全球指数行情，使用模拟账户进行实时交易或历史 K 线回放训练。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=20261124range2" />
    <link rel="stylesheet" href="./journal.css?v=20261124" />
    <link rel="stylesheet" href="./trade-history.css?v=20261124trend3" />
  </head>
  <body data-workspace="replay">
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="#terminal" aria-label="训练的大鲨鱼交易终端"
          ><img src="./favicon.svg" alt="" /><span>训练的大鲨鱼</span></a
        >
        <nav aria-label="主导航">
          <div class="workspace-switch" role="group" aria-label="选择交易模式">
            <button type="button" data-action="live" class="nav"><i data-i="indicator"></i>实时交易</button>
            <button type="button" data-action="replay" class="nav active" aria-current="page"><i data-i="rewind"></i>历史训练</button>
          </div>
          <div class="record-links" role="group" aria-label="交易记录">
            <button type="button" data-action="history" class="nav">交易历史</button>
            <button type="button" data-action="journal" class="nav">交易复盘</button>
          </div>
        </nav>
        <div class="mast-actions">
          <button id="themeSwitch" class="quiet" aria-label="切换到浅色" title="切换到浅色">
            <i aria-hidden="true"></i><span>浅色</span>
          </button>
          <button data-action="help" aria-label="使用指南" class="quiet help">
            <i data-i="help"></i><span>使用指南</span></button
          ><button data-action="new" class="primary new"><i data-i="plus"></i>新建训练</button>
        </div>
      </div>
    </header>
    <main id="terminal">
      <div class="page-title">
        <div class="title-row">
          <h1 id="workspaceTitle">历史训练</h1>
          <div class="mode-badge" id="modeBadge"></div>
          <span id="liveStatus" class="workspace-status" role="status"></span>
          <button data-action="today" id="todayBtn" class="today-btn">今日行情</button>
        </div>
      </div>
      <section id="workspaceNotice" class="workspace-notice" hidden aria-labelledby="workspaceNoticeTitle">
        <div class="notice-copy" aria-live="polite">
          <h2 id="workspaceNoticeTitle"></h2>
          <p id="workspaceNoticeText"></p>
        </div>
        <button type="button" data-action="retryWorkspace" class="primary"><i data-i="rewind"></i>重新连接</button>
      </section>
      <section aria-label="市场选择">
        <div class="section-line">
          <h2>市场观察 <small class="watch-caption">最新报价</small></h2>
          <button class="text-button" data-action="markets">全部市场 <i data-i="market"></i></button>
        </div>
        <div class="watchlist" id="watchlist"></div>
      </section>
      <div class="workspace">
        <section class="panel chart-panel" id="chartPanel" aria-label="行情图表">
          <div class="instrument-row">
            <div class="instrument-info">
              <div class="instrument-logo"><i data-i="candles"></i></div>
              <div>
                <div class="instrument-title">
                  <h2 id="instrumentName">中证 1000</h2>
                  <span id="region" class="region"></span>
                </div>
                <div class="instrument-code" id="instrumentCode"></div>
                <div id="trainingClock" class="training-clock" hidden></div>
              </div>
            </div>
            <div class="quote"><strong id="quotePrice"></strong><span id="quoteChange"></span></div>
          </div>
          <div class="chart-toolbar">
            <div class="period-buttons" id="periodButtons"></div>
            <span class="divider"></span><span class="flex"></span
            ><button class="tool icon-only" data-action="fit" title="回到最新" aria-label="回到最新">
              <i data-i="fit"></i></button
            ><button class="tool icon-only" data-action="expand" title="展开图表" aria-label="展开图表">
              <i data-i="expand"></i>
            </button>
          </div>
          <div class="chart-readings">
            <div class="ohlc" id="ohlc"></div>
            <span class="chart-convention"><span class="mouse-guide">滚轮缩放 · 右键拖动　</span>红涨 · 绿跌</span>
          </div>
          <div class="plot-body">
            <div class="draw-tools" id="drawingTools" role="group" aria-label="图表绘图工具"></div>
            <div id="drawingMenu" class="drawing-menu" role="menu" hidden></div>
            <div id="plot">
              <button type="button" id="trendQuickDelete" class="trend-quick-delete" title="删除这条画线（Delete）" hidden>
                <i data-i="trash" aria-hidden="true"></i>删除
              </button>
            </div>
          </div>
          <div class="pencil-row">
            <div id="trendColors" class="trend-swatches" role="group" aria-label="趋势线颜色">
              <span>线色</span>
              <button type="button" data-trend-color="#41bf88" style="--swatch:#41bf88" aria-label="绿色" aria-pressed="true">绿</button>
              <button type="button" data-trend-color="#ff5553" style="--swatch:#ff5553" aria-label="红色" aria-pressed="false">红</button>
              <button type="button" data-trend-color="#ad7aff" style="--swatch:#ad7aff" aria-label="紫色" aria-pressed="false">紫</button>
            </div>
            <button data-action="undoDraw" title="撤销上一条画线"><i data-i="rewind"></i>撤销上一条</button>
            <span id="drawingHint" aria-live="polite"></span><small id="drawingCount"></small>
          </div>
          <div id="trendEditor" class="trend-editor" role="group" aria-label="所选画线样式" hidden>
            <strong>画线样式</strong>
            <label class="trend-width">粗细
              <select id="trendWidth" aria-label="画线粗细">
                <option value="1">1 px</option><option value="2">2 px</option><option value="3">3 px</option><option value="4">4 px</option><option value="5">5 px</option>
              </select>
            </label>
            <label class="trend-width">线型
              <select id="trendPattern" aria-label="线型"><option value="solid">实线</option><option value="dashed">虚线</option><option value="dotted">点线</option></select>
            </label>
            <button type="button" id="deleteTrend" class="tool icon-only" aria-label="删除选中画线" title="删除此线"><i data-i="trash"></i></button>
          </div>
          <div class="replay">
            <div class="play-group">
              <button
                data-action="random"
                id="randomBtn"
                class="random-btn"
                title="存档当前训练，从另一段行情空仓开练"
              >
                <i data-i="shuffle"></i><span id="randomLabel">随机时段</span>
              </button>
              <select id="archiveYear" aria-label="选择回放年份，选中后跳转" title="选择年份后立即跳转"><option value="auto">往年随机</option></select>
              <button
                class="play-btn"
                data-action="play"
                id="play"
                aria-label="播放"
                title="播放 / 暂停（空格）"
              ></button
              ><button class="step-btn" data-action="step" title="前进一根（→）">
                <i data-i="step"></i><span>下一根</span></button
              ><select id="speed" aria-label="回放速度">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
                <option value="8">8×</option>
              </select>
            </div>
            <div id="feedMeta" class="feed-meta" hidden></div>
            <div class="progress-block" id="progressBlock">
              <div><span id="replayText"></span><span id="progressNum"></span></div>
              <progress id="progress" max="100" value="0"></progress>
            </div>
          </div>
          <div id="practiceRange" class="practice-range" hidden></div>
          <div id="liveHistoryRange" class="practice-range live-history-range" hidden>
            <span id="liveHistoryDates"></span><button type="button" class="text-button" data-action="showHistoryWindow">查看全段</button>
          </div>
        </section>
        <aside class="panel ticket">
          <div class="panel-heading">
            <div>
              <i data-i="orders"></i>
              <h2>模拟下单</h2>
            </div>
            <span class="currency" id="currency"></span>
          </div>
          <div class="ticket-content">
            <div class="account-label"><span>账户净值</span><i data-i="fund"></i></div>
            <strong id="equity" class="account-value"></strong>
            <div class="account-sub">可用资金 <span id="available"></span></div>
            <div class="pnl-grid" aria-label="账户实时盈亏">
              <div><span>浮动盈亏</span><b id="liveUnrealized">0.00</b></div>
              <div><span>已实现盈亏</span><b id="liveRealized">0.00</b></div>
              <div><span>累计盈亏</span><b id="liveTotalPnl">0.00</b></div>
            </div>
            <div class="position-strip">
              <span id="positionSummary">空仓</span
              ><button id="quickClose" class="flatten" data-action="closePosition" disabled>一键平仓</button>
            </div>
            <section class="exposure-stat" id="exposureStats" aria-label="本次训练空仓率"></section>
            <section id="contractInfo" class="contract-info" aria-label="保证金与杠杆" hidden>
              <dl class="risk-metrics">
                <div><dt id="marginRateLabel">开仓保证金率</dt><dd id="contractMarginRate"></dd></div>
                <div><dt id="leverageLabel">合约杠杆</dt><dd id="contractLeverage"></dd></div>
                <div><dt title="持仓名义金额 ÷ 账户净值">账户实际杠杆</dt><dd id="accountLeverage"></dd></div>
              </dl>
              <div id="contractTermsNote" class="contract-terms"></div>
            </section>
            <label class="field" id="perpLeverageField" hidden><span>全仓杠杆</span>
              <select id="perpLeverage" aria-label="BTC 永续合约杠杆"></select>
            </label>
            <div class="sides">
              <button id="buy" data-side="buy">买入 / 做多</button
              ><button id="sell" data-side="sell">卖出 / 做空</button>
            </div>
            <label class="field"
              ><span>委托类型</span
              ><select id="orderType">
                <option value="market">市价单</option>
                <option value="limit">限价单</option>
                <option value="stop">停止单（触发市价）</option>
                <option value="stopLimit">停止限价单</option>
              </select></label
            >
            <label class="field" id="priceField" hidden
              ><span id="priceLabel">委托价格</span
              ><input type="number" id="orderPrice" min="0.000001" step="any" inputmode="decimal"
            /></label>
            <label class="field" id="limitField" hidden
              ><span>执行限价</span
              ><input type="number" id="limitPrice" min="0.000001" step="any" inputmode="decimal"
            /></label>
            <div class="field">
              <label for="qty">交易数量 <small id="qtyUnit">单位</small></label>
              <div class="qty-control">
                <button data-action="less" aria-label="减少数量"><i data-i="minus"></i></button
                ><input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric" /><button
                  data-action="more"
                  aria-label="增加数量"
                >
                  <i data-i="plus"></i>
                </button>
              </div>
              <div class="fractions" id="fractions"></div>
            </div>
            <details id="protection">
              <summary>附加止盈 / 止损<i data-i="chevron"></i></summary>
              <div class="twocol">
                <label class="field"
                  ><span>止盈价</span><input type="number" id="tp" step="any" placeholder="选填" /></label
                ><label class="field"
                  ><span>止损价</span><input type="number" id="sl" step="any" placeholder="选填"
                /></label>
              </div>
            </details>
            <div class="estimate" id="lotValueRow" hidden><span>一手合约价值</span><b id="lotValue"></b></div>
            <div class="estimate" id="marginEstimateRow" hidden>
              <span>一手开仓保证金</span><b id="marginEstimate"></b>
            </div>
            <div class="estimate"><span>本单名义金额</span><b id="notional"></b></div>
            <div class="estimate" id="orderMarginRow" hidden><span>本单开仓部分保证金</span><b id="orderMargin"></b></div>
            <button class="submit" data-action="submit" id="submitOrder">模拟买入</button>
            <div class="ticket-foot" id="feeHint"></div>
          </div>
        </aside>
      </div>
      <section class="panel ledger">
        <div class="ledger-top">
          <div id="ledgerTabs"></div>
          <button class="text-button" data-action="history">交易历史 <i data-i="orders"></i></button>
        </div>
        <div id="ledgerBody"></div>
      </section>
    </main>
    <main id="history" hidden></main>
    <main id="journal" hidden></main>
    <footer>
      <span><i data-i="lock"></i><span id="saved">训练记录保存在此浏览器</span></span
      ><span>训练的大鲨鱼 <b> / </b>K 线训练台</span>
    </footer>
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button data-action="dismiss" class="tool icon-only" aria-label="关闭弹窗">
          <i data-i="close"></i>
        </button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <div id="toast" aria-live="polite" role="status"></div>
    <script type="module" src="./src/app.js?v=20261124range2"></script>
  </body>
</html>
