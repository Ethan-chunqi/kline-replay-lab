  </svg>
  <header class="topbar">
    <div class="shell nav-inner">
      <a class="brand" href="#market" aria-label="刘鲨鱼 Bulls &amp; Bears"><img class="brand-mark" src="./brand/liushayu-avatar.jpg" width="36" height="36" alt=""><span>刘鲨鱼<small>Bulls &amp; Bears</small></span></a>
      <nav aria-label="主导航" data-i18n-aria="主导航">
        <a href="#market" class="nav-link active" id="nav-market"><svg><use href="#i-market"/></svg><span data-i18n="行情总览">行情总览</span></a>

      </div>

  <main id="main" class="shell">
    <section class="market-tools" id="market" data-i18n-aria="市场数据" aria-label="市场数据">
      <div class="market-tabs" role="group" aria-label="选择市场" data-i18n-aria="选择市场">
        <button type="button" data-region="crypto" aria-pressed="true" data-i18n="加密货币">加密货币</button>
        <button type="button" data-region="us" aria-pressed="false" data-i18n="美股">美股</button>
        <button type="button" data-region="cn" aria-pressed="false" data-i18n="A 股">A 股</button>
      </div>
      <div class="asset-switcher">
        <div id="instruments" class="contracts" role="group" data-i18n-aria="热门标的" aria-label="热门标的"></div>
        <select id="asset-select" class="small-select asset-select" data-i18n-aria="全部标的" aria-label="全部标的" hidden></select>
      </div>
    </section>
    <section class="hero" aria-labelledby="asset-name">
      <div class="quote">
        <div class="asset-line"><img class="hero-coin" id="hero-coin" src="./coins/BTC.png" alt=""><h1 id="asset-name">BTC<span>USDT</span></h1><span class="pair" id="asset-kind">永续</span></div>
        <div class="price-line"><strong id="price">—</strong><span id="quote-unit">USDT</span></div>
        <div class="change-line"><span class="change-pill" id="change24">—</span><span id="change-name">24 小时涨跌幅</span></div>
      </div>
      <dl class="day-stats">
        <div><dt id="day-high-label">24 小时最高</dt><dd id="day-high">—</dd></div>
        <div><dt id="day-low-label">24 小时最低</dt><dd id="day-low">—</dd></div>
      </dl>
      <div class="trend">
        <div class="trend-meta"><span><i></i><span id="trend-name">24 小时价格走势</span></span><span id="trend-range"></span></div>
        <canvas id="spark" role="img" aria-label="价格走势" data-i18n-aria="价格走势"></canvas>
        <div class="trend-times"><span id="trend-start">—</span><span id="trend-end">—</span></div>
      </div>
    </section>
    <div id="feed-notice" class="notice" role="status" hidden></div>

    <div class="market-grid">
      <section class="card chart-card" aria-labelledby="chart-title">
        <div class="card-head chart-head">
          <div class="title-line"><span class="heading-icon"><svg><use href="#i-candle"/></svg></span><h2 id="chart-title" data-i18n="K 线走势">K 线走势</h2></div>
          <div class="segmented intervals" role="group" aria-label="K 线周期" data-i18n-aria="K 线周期">
            <button type="button" data-interval="15m" aria-pressed="true" data-i18n="15 分钟">15 分钟</button>
            <button type="button" data-interval="30m" aria-pressed="false" data-i18n="30 分钟">30 分钟</button>
            <button type="button" data-interval="1h" aria-pressed="false" data-i18n="1 小时">1 小时</button>
            <button type="button" data-interval="1d" aria-pressed="false" data-i18n="日线">日线</button>
          </div>
        </div>
        <div class="ohlc" aria-label="开高低收" data-i18n-aria="开高低收"><span><span data-i18n="开">开</span><b id="open">—</b></span><span><span data-i18n="高">高</span><b id="high">—</b></span><span><span data-i18n="低">低</span><b id="low">—</b></span><span><span data-i18n="收">收</span><b id="close">—</b></span></div>
        <div class="chart-area"><div id="chart"></div><span id="chart-empty"></span></div>
        <div class="chart-foot">
          <div class="chart-legends"><span id="bar-source" class="muted" hidden></span><span class="legend"><i></i><span data-i18n="成交量">成交量</span><span class="muted" id="volume-unit"></span></span><span class="legend"><i class="gold-bar"></i><span data-i18n="金色为周期极值">金色为周期极值</span></span></div>
          <div class="chart-actions"><select id="view-range" class="small-select" data-i18n-aria="显示范围" aria-label="显示范围"></select><button id="reset" type="button"><svg><use href="#i-reset"/></svg><span data-i18n="重置视图">重置视图</span></button></div>
        </div>
        <div class="chart-context" id="chart-context" hidden><span id="context-label"></span><button type="button" id="back-latest" data-i18n="返回最新">返回最新</button></div>
      </section>
      <section class="card extremes" aria-labelledby="extremes-title">
        <div class="card-head"><div class="title-line"><span class="heading-icon"><svg><use href="#i-range"/></svg></span><h2 id="extremes-title" data-i18n="周期高低点">周期高低点</h2></div><span class="subtle-tag" id="cycle-status"></span></div>
        <article class="extreme-box high-box">
          <div class="extreme-top"><div class="extreme-name"><span class="direction-icon"><svg><use href="#i-down"/></svg></span><h3 data-i18n="历史高点回撤">历史高点回撤</h3></div><button class="locate" data-locate="high" data-i18n-aria="查看高点 K 线" aria-label="查看高点 K 线" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.2"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg><span data-i18n="定位 K 线">定位 K 线</span></button></div>
          <strong class="extreme-value" id="drawdown">—</strong>
          <div class="level"><span data-i18n="历史最高价">历史最高价</span><strong id="high-price">—</strong></div>
          <div class="when"><span><svg><use href="#i-clock"/></svg><b id="high-ago">—</b></span><time id="high-at">—</time></div>
        </article>
        <article class="extreme-box low-box">
          <div class="extreme-top"><div class="extreme-name"><span class="direction-icon"><svg><use href="#i-up"/></svg></span><h3 data-i18n="周期低点反弹">周期低点反弹</h3></div><button class="locate" data-locate="low" data-i18n-aria="查看低点 K 线" aria-label="查看低点 K 线" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.2"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg><span data-i18n="定位 K 线">定位 K 线</span></button></div>
          <strong class="extreme-value" id="rebound">—</strong>
          <div class="level"><span data-i18n="见顶后最低价">见顶后最低价</span><strong id="low-price">—</strong></div>
          <div class="when"><span><svg><use href="#i-clock"/></svg><b id="low-ago">—</b></span><time id="low-at">—</time></div>
        </article>
      </section>
    </div>
    <section class="card calculator" id="calculator" aria-labelledby="calc-title" data-direction-colors="default">
      <div class="card-head"><div class="title-line"><span class="heading-icon"><svg><use href="#i-calc"/></svg></span><h2 id="calc-title" data-i18n="positions">你的持仓</h2></div><div class="direction-tools">

          <span class="subtle-tag" id="position-unit">USDT</span>
        </div></div>
      <div id="position-panel"></div>
    </section>
